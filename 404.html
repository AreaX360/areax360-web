<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · AreaX360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:'Plus Jakarta Sans',system-ui,sans-serif;
background:#070A16;color:#E2E8F0;
min-height:100vh;display:flex;align-items:center;justify-content:center;
text-align:center;padding:20px;
-webkit-font-smoothing:antialiased;
}
.wrap{max-width:420px}
.code{
font-size:clamp(4rem,15vw,7rem);font-weight:800;line-height:1;
background:linear-gradient(135deg,#FF4D00,#00D4FF);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
background-clip:text;margin-bottom:16px;
}
h1{font-size:1.2rem;font-weight:600;margin-bottom:12px}
p{font-size:0.9rem;color:#8892A8;line-height:1.6;margin-bottom:28px}
a{
display:inline-block;padding:12px 28px;border-radius:10px;
background:linear-gradient(135deg,#FF4D00,#FF7A3D);
color:#fff;text-decoration:none;font-weight:600;font-size:0.85rem;
transition:transform 0.2s,opacity 0.2s;
}
a:hover{transform:translateY(-2px);opacity:0.9}
</style>
</head>
<body>
<div class="wrap">
<div class="code">404</div>
<h1>Página no encontrada</h1>
<p>La página que busca no existe o fue movida. Use las herramientas desde la página principal.</p>
<a href="/">Ir al inicio</a>
</div>
</body>
</html>
